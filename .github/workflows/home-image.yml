# Fork-only: builds the `home` branch (upstream main + local features) for the home cluster.
name: Home Image
permissions:
    contents: read
on:
    workflow_dispatch:
    push:
        branches:
            - home
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - uses: pnpm/action-setup@v6
              name: Install pnpm
              with:
                  run_install: false

            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v6
              name: Setup pnpm cache
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: SvelteKit types generate
              run: pnpm svelte-kit sync

            - name: Prisma Client Generate
              run: pnpm prisma generate

            - name: Migrations apply and match schema
              run: .github/scripts/check-migrations.sh

            - name: Svelte Check
              run: pnpm run check

            - name: Lint
              run: pnpm run lint

            - name: Unit tests
              run: pnpm run test:unit

    build:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Short SHA
              id: vars
              shell: bash
              run: |
                  echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Docker Tags
              id: tags
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=home
                      type=sha

            - name: Build and Push
              uses: docker/build-push-action@v7
              with:
                  context: ./
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.tags.outputs.tags }}
                  labels: ${{ steps.tags.outputs.labels }}
                  build-args: |
                      SHA=${{ github.sha }}
                      VERSION=home-${{ steps.vars.outputs.short_sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
